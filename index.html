<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sua Galega RS</title>
  <meta name="description" content="Site, Instagram, WhatsApp e canal no Telegram da Sua Galega RS.">
  <meta name="theme-color" content="#1a0010">
  <!-- Prévia quando o link é compartilhado (WhatsApp, Instagram, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Sua Galega RS">
  <meta property="og:description" content="Site, Instagram, WhatsApp e canal no Telegram.">
  <meta property="og:image" content="img/perfil.svg">
  <link rel="icon" id="favicon" href="img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg" id="bg"><div class="bg-image" id="bgImage"></div><div class="glow glow-1"></div><div class="glow glow-2"></div><div class="glow glow-3"></div></div>
  <div class="particles" id="particles" aria-hidden="true"></div>

  <main class="page">
    <header class="profile">
      <div class="avatar-wrap"><img id="avatar" class="avatar" alt=""></div>
      <h1 id="name" class="name"></h1>
      <p id="bio" class="bio"></p>
    </header>
    <nav id="links" class="links" aria-label="Links"></nav>
    <footer id="footer" class="footer"></footer>
  </main>

  <div class="age-gate" id="ageGate" hidden>
    <div class="age-card" role="dialog" aria-modal="true" aria-labelledby="ageTitle">
      <div class="age-badge">18+</div>
      <h2 id="ageTitle"></h2>
      <p id="ageText"></p>
      <button type="button" id="ageYes" class="age-yes"></button>
      <a id="ageNo" class="age-no"></a>
    </div>
  </div>

  <!-- carrega sempre a versão mais nova do config.js -->
  <script>document.write('<script src="config.js?v=' + Date.now() + '"><\/script>');</script>
  <script src="app.js"></script>
</body>
</html>
